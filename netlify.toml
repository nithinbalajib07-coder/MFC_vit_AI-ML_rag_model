# Netlify Configuration for Saint Mary's University FAQ Assistant
[build]
  publish = "."
  command = "echo 'Build successful: SMU Knowledge Assistant static assets prepared.'"

# SPA fallback redirect so any deep link or refresh loads index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
